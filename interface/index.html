<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Geek File Manager</title>
  <link rel="stylesheet" href="/index.css">
  <link rel="stylesheet" href="/theme.css">
</head>

<body>
  <div class="container" role="application" aria-label="Geek File Manager">

    <!-- ── 1.  BRAND BAR ────────────────────────────────────────── -->
    <header class="brand-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2zM6 11h12v2H6zM6 15h8v2H6z"/>
          </svg>
        </span>
        <span class="title" onclick="Dialog.show('info')" role="button" tabindex="0" aria-label="About Geek File Manager">
          <span class="brand-name">geek<span class="brand-sep">_</span>file<span class="brand-sep">_</span>manager</span>
        </span>
      </div>
      <div class="session-bar">
        <button id="act-btn-logout" class="btn-action" type="button">logout</button>
      </div>
    </header>

    <!-- ── 2.  STORAGE PANEL ──────────────────────────────────────
         JS query: .free-space .free-sd span
         The FIRST <span> descendant of .free-sd is the JS target — it
         gets innerHTML overwritten with "used / total" each refresh,
         so we keep it free of children. -->
    <section class="panel storage-panel free-space" aria-label="Storage">
      <span class="btn-action act-browse block-space free-sd active" data-path="/" role="button" tabindex="0" aria-label="Navigate to root">
        <span class="storage-stats">0 MB</span>
        <span class="storage-gauge" aria-hidden="true">
          <span class="storage-fill"></span>
          <span class="storage-ticks"></span>
        </span>
        <span class="storage-hint" aria-hidden="true">tap to return to root</span>
      </span>
    </section>

    <!-- ── 3.  NAVIGATOR PANEL  (path + toolbar) ─────────────────── -->
    <section class="panel nav-panel" aria-label="Navigator">
      <div class="path-bar">
        <span class="prompt-glyph" aria-hidden="true">$</span>
        <span class="current-path">Storage://</span>
      </div>

      <div class="body-actions" role="toolbar" aria-label="File operations">
        <label class="icon-action" title="Upload files to current folder" aria-label="Upload files">
          <input type="file" class="inp-uploader" multiple autocomplete="off">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3l-7 7h4v6h6v-6h4l-7-7zM4 19h16v2H4z"/>
          </svg>
        </label>
        <label class="icon-action" title="Upload folder to current folder" aria-label="Upload folder">
          <input type="file" class="inp-uploader" webkitdirectory directory multiple autocomplete="off">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2zM12 10l-4 4h2.5v3h3v-3H16l-4-4z"/>
          </svg>
        </label>
        <button class="icon-action act-oinput" type="button" data-action="createFile" title="Create new file" aria-label="Create new file">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM13 9V3.5L18.5 9H13zM11 11h2v3h3v2h-3v3h-2v-3H8v-2h3v-3z"/>
          </svg>
        </button>
        <button class="icon-action act-oinput" type="button" data-action="createFolder" title="Create new folder" aria-label="Create new folder">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2zM14 11h2v3h3v2h-3v3h-2v-3h-3v-2h3v-3z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ── 4.  CONTENTS PANEL (file list) ────────────────────────── -->
    <section class="panel content-panel" aria-label="Directory contents">
      <div class="explorer file-list" role="list"></div>
    </section>

  </div>

  <!-- ── FILE ROW TEMPLATE  (JS clones .file-row + .upload-loading) -->
  <template id="t">
    <div class="file-row" role="listitem">
      <span class="col-name"></span>
      <span class="col-size"></span>
      <span class="col-action">
        <button class="icon-action act-play" type="button" title="Run this file" aria-label="Run">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 4v16l14-8L7 4z"/>
          </svg>
        </button>
        <a class="icon-action act-download" title="Download" aria-label="Download">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 17l7-7h-4V3h-6v7H5l7 7zM4 19h16v2H4z"/>
          </svg>
        </a>
        <button class="icon-action act-crack" type="button" title="Crack WPA2" aria-label="Crack WPA2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 2L3 14h6l-2 8 11-14h-7l2-6z"/>
          </svg>
        </button>
        <button class="icon-action act-oinput act-rename" type="button" data-action="" title="Rename" aria-label="Rename">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
        </button>
        <button class="icon-action act-delete" type="button" title="Delete" aria-label="Delete">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM9 9h2v9H9zM13 9h2v9h-2zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
        </button>
      </span>
    </div>
    <div class="upload-loading">
      <span class="upload-name"></span>
      <div class="bar"></div>
    </div>
  </template>

  <!-- ── DIALOGS ───────────────────────────────────────────────── -->
  <div class="dialog-background hidden" role="presentation">

    <div class="dialog upload hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-upload-title">
      <div class="dialog-head">
        <span class="dlg-pips" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dlg-head-text" id="dlg-upload-title">uploading</span>
      </div>
      <div class="dialog-body"></div>
    </div>

    <div class="dialog info hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-info-title">
      <div class="dialog-head">
        <span class="dlg-pips" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dlg-head-text" id="dlg-info-title">info</span>
      </div>
      <div class="dialog-body">
        <p>You can also help develop the File Manager using
          <a href="https://github.com/lshaf/puteros-file-manager" target="_blank" rel="noopener">Geek File Manager</a>
          by <a href="https://github.com/lshaf" target="_blank" rel="noopener">lshaf</a>.</p>
      </div>
      <div class="dialog-footer">
        <button class="btn-action act-dialog-close act-escape" type="button">close</button>
      </div>
    </div>

    <div class="dialog oinput hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-oinput-title">
      <div class="dialog-head" id="dlg-oinput-title">
        <span class="dlg-pips" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dlg-head-text">
          <span class="oinput-title">rename</span>
          <span class="oinput-file-name"></span>
        </span>
      </div>
      <div class="dialog-body">
        <label for="oinput-input" class="oinput-label">new name</label>
        <input type="text" id="oinput-input" autocomplete="off" spellcheck="false">
      </div>
      <div class="dialog-footer">
        <button class="btn-action act-save-oinput-file" type="button">save</button>
        <button class="btn-action act-dialog-close act-escape" type="button">close</button>
      </div>
    </div>

    <div class="dialog auth hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-auth-title">
      <div class="dialog-head" id="dlg-auth-title">
        <span class="dlg-pips" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dlg-head-text">
          <span class="oinput-title">authentication</span>
        </span>
      </div>
      <div class="dialog-body">
        <label for="auth-password" class="oinput-label">password</label>
        <input type="password" id="auth-password" autocomplete="off" spellcheck="false">
      </div>
      <div class="dialog-footer">
        <button class="btn-action act-auth-login" type="button">login</button>
      </div>
    </div>

    <div class="dialog crack hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-crack-title">
      <div class="dialog-head">
        <span class="dlg-pips" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dlg-head-text" id="dlg-crack-title">
          crack: <span class="crack-file-name"></span>
        </span>
      </div>
      <div class="dialog-body">
        <div class="crack-phase-dict">
          <div class="crack-dict-label">select dictionary</div>
          <select class="crack-dict-select" aria-label="Dictionary"></select>
        </div>
        <div class="crack-phase-run hidden">
          <div class="crack-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div class="crack-bar"></div>
            <span class="crack-bar-pct">0%</span>
          </div>
          <div class="crack-stats"></div>
          <div class="crack-mode hidden"></div>
        </div>
        <div class="crack-result hidden"></div>
        <div class="crack-save-status hidden" role="status"></div>
      </div>
      <div class="dialog-footer">
        <button class="btn-action act-crack-go"          type="button" disabled>crack</button>
        <button class="btn-action act-crack-stop hidden" type="button">stop</button>
        <button class="btn-action act-crack-retry-save hidden" type="button">retry save</button>
        <button class="btn-action act-dialog-close act-escape" type="button">close</button>
      </div>
    </div>

    <div class="dialog editor hidden" role="dialog" aria-modal="true" aria-labelledby="dlg-editor-title">
      <div class="dialog-head">
        <span class="dlg-pips" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="dlg-head-text" id="dlg-editor-title">
          <span class="editor-mode-label">edit</span>: <span class="editor-file-name"></span>
        </span>
      </div>
      <div class="editor-stage">
        <textarea class="file-content" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <div class="editor-image hidden">
          <img class="editor-img" alt="">
        </div>
        <pre class="editor-hex hidden"></pre>
      </div>
      <div class="dialog-footer">
        <button class="btn-action act-open-as-text hidden" type="button">open as text</button>
        <button class="btn-action act-save-edit-file"      type="button" title="CTRL + S">save</button>
        <button class="btn-action act-dialog-close act-escape" type="button">close</button>
      </div>
    </div>

  </div>

  <div class="loading-area hidden" role="status" aria-live="polite">
    <div class="text"></div>
  </div>

  <div class="upload-area hidden" aria-hidden="true"></div>

  <script src="/index.js"></script>
</body>

</html>
